<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Контроль сеансов 1С</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    main { width: min(100%, 28rem); padding: 2rem; border-radius: .8rem; background: white; box-shadow: 0 8px 30px #17203318; }
    h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
    p { margin: 0 0 1.5rem; color: #526075; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; margin-top: .4rem; padding: .75rem .8rem; border: 1px solid #cbd3df; border-radius: .5rem; font: inherit; }
    input:focus { border-color: #2563eb; outline: 3px solid #2563eb20; }
    button { width: 100%; margin-top: 1.4rem; padding: .8rem; border: 0; border-radius: .5rem; color: white; background: #1d4ed8; font: inherit; font-weight: 700; cursor: pointer; }
    .error { margin: 1rem 0; padding: .75rem; border-radius: .5rem; color: #8c1d1d; background: #ffe8e8; }
    .mode { margin-top: 1rem; font-size: .875rem; text-align: center; }
  </style>
  <link rel="stylesheet" href="/static/app.css?v=3">
</head>
<body class="login-page">
  <main>
    <div class="login-mark">1С</div>
    <div class="eyebrow">RAS CONTROL CENTER</div>
    <h1>Контроль сеансов 1С</h1>
    <p>Введите учётные данные администратора кластера.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form action="/login" method="post">
      <label for="username">Логин</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" autofocus required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
    <p class="mode">Фоновый мониторинг и выборочный контроль пользовательских сеансов</p>
  </main>
</body>
</html>
