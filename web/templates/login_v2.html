<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Контроль сеансов 1С</title>
  <link rel="icon" href="/static/favicon.svg?v=9" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/variables.css?v=9">
  <link rel="stylesheet" href="/static/css/base.css?v=9">
  <link rel="stylesheet" href="/static/css/login.css?v=9">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-logo" aria-hidden="true">1C</div>
    <div class="login-eyebrow">RAS CONTROL CENTER</div>
    <h1>Контроль сеансов 1С</h1>
    <p class="login-subtitle">Введите учётные данные администратора кластера.</p>
    {% if error %}<div class="login-error" role="alert"><span>!</span><div><strong>Не удалось выполнить вход</strong><small>{{ error }}</small></div></div>{% endif %}
    <form action="/login" method="post">
      <label for="username"><span>Логин</span><input id="username" name="username" value="{{ username }}" placeholder="Администратор" autocomplete="username" autofocus required></label>
      <label for="password"><span>Пароль</span><input id="password" name="password" type="password" placeholder="••••••••••" autocomplete="current-password"></label>
      <button type="submit">Войти</button>
    </form>
    <p class="login-note">Фоновый мониторинг и выборочный контроль пользовательских сеансов</p>
  </main>
</body>
</html>
